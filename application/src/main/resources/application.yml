spring:
  application:
    name: Application
  datasource:
    url: jdbc:postgresql://localhost:5432/xcto
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: 123456

server:
  port: 65535
  error:
    include-message: always
    include-exception: true

mybatis:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
